<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Sheep · world3d dev</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #f4efe4; font: 13px system-ui, sans-serif; color: #4a3b35; }
      #world { position: absolute; inset: 0; }
      #bar { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 70vw; z-index: 5; }
      #bar button { border: 0; border-radius: 8px; padding: 5px 10px; background: rgba(255,250,240,0.92); box-shadow: 0 1px 4px rgba(0,0,0,.2); cursor: pointer; font: inherit; }
      #info { position: absolute; left: 8px; bottom: 8px; background: rgba(255,250,240,0.9); padding: 4px 8px; border-radius: 8px; z-index: 5; }
      #portraits { position: absolute; right: 8px; top: 8px; display: grid; grid-template-columns: repeat(4, 64px); gap: 4px; z-index: 5; }
      #portraits img { width: 64px; height: 64px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
      body.noui #bar, body.noui #portraits, body.noui #info { display: none; }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <div id="bar"></div>
    <div id="portraits"></div>
    <div id="info"></div>
    <script type="module" src="/src/world3d/dev.ts"></script>
  </body>
</html>
